<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BN · Beef Noodles</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: #fff;
  font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* 顶部导航 */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 48px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.nav-logo {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1px;
}

.nav-menu {
  display: flex;
  gap: 48px;
  font-size: 15px;
}

.nav-menu a {
  color: #94a3b8;
  text-decoration: none;
  position: relative;
  transition: color 0.2s;
}

.nav-menu a:hover,
.nav-menu a.active {
  color: #fff;
}

.nav-menu a.active::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -8px;
  width: 100%;
  height: 2px;
  background: #3b82f6;
}

/* 主视觉 */
.hero {
  position: relative;
  min-height: calc(100vh - 90px);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

/* 椭圆轨道容器 */
.orbit-wrap {
  position: absolute;
  width: 620px;
  height: 340px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.orbit-svg {
  width: 100%;
  height: 100%;
}

.orbit-line {
  fill: none;
  stroke: rgba(255,255,255,0.35);
  stroke-width: 1px;
}

/* 小行星 */
.dot {
  fill: #3b82f6;
  filter: drop-shadow(0 0 8px #3b82f6) drop-shadow(0 0 16px #3b82f6);
}

.dot-small {
  fill: #60a5fa;
  filter: drop-shadow(0 0 6px #60a5fa) drop-shadow(0 0 12px #60a5fa);
}

.dot-large {
  fill: #8b5cf6;
  filter: drop-shadow(0 0 10px #8b5cf6) drop-shadow(0 0 20px #8b5cf6);
}

/* 中心文字 */
.hero-text {
  z-index: 2;
  text-align: center;
}

.hero-text h1 {
  font-size: 180px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -2px;
}

.hero-text .en {
  font-size: 32px;
  letter-spacing: 2px;
  margin-top: 12px;
  color: #cbd5e1;
}

.hero-text .tags {
  font-size: 16px;
  color: #94a3b8;
  margin-top: 8px;
  letter-spacing: 1px;
}

/* 底部按钮栏 */
.bottom-tab-bar {
  position: absolute;
  bottom: 80px;
  display: flex;
  align-items: center;
  gap: 0;
  width: min(90%, 1000px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 8px 12px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(8px);
}

.tab-item {
  flex: 1;
  text-align: center;
  font-size: 16px;
  padding: 16px 0;
  position: relative;
  cursor: pointer;
  color: #9ca3af;
  transition: color 0.2s;
}

.tab-item:hover {
  color: #fff;
}

.tab-item.active {
  color: #fff;
}

.tab-item.active::after {
  content: "";
  position: absolute;
  left: 30%;
  bottom: 8px;
  width: 40%;
  height: 3px;
  background: linear-gradient(90deg, #3b82f6, #8b5cf6);
  border-radius: 2px;
}

.btn-cooperate {
  padding: 14px 32px;
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 999px;
  font-size: 15px;
  cursor: pointer;
  color: #fff;
  transition: 0.2s;
}

.btn-cooperate:hover {
  border-color: #3b82f6;
  background: rgba(59, 130, 246, 0.12);
  box-shadow: 0 0 18px rgba(59, 130, 246, 0.35);
}

/* 内容区 */
.section {
  padding: 100px 48px;
  max-width: 900px;
  margin: 0 auto;
}

.section h2 {
  font-size: 28px;
  margin-bottom: 24px;
  border-left: 4px solid #8b5cf6;
  padding-left: 12px;
}

.section p {
  color: #9ca3af;
  line-height: 1.9;
  font-size: 16px;
}

/* 适配 */
@media (max-width: 1024px) {
  .hero-text h1 {
    font-size: 110px;
  }

  .hero-text .en {
    font-size: 22px;
  }

  .orbit-wrap {
    width: 420px;
    height: 240px;
  }

  .bottom-tab-bar {
    flex-wrap: wrap;
  }

  .tab-item {
    flex: 1 1 50%;
  }

  .btn-cooperate {
    width: 100%;
    margin-top: 12px;
    text-align: center;
  }

  nav {
    padding: 16px 24px;
  }

  .nav-menu {
    gap: 24px;
    font-size: 14px;
  }
}

@media (max-width: 640px) {
  .hero-text h1 {
    font-size: 72px;
  }

  .hero-text .en {
    font-size: 18px;
  }

  .orbit-wrap {
    width: 320px;
    height: 180px;
  }

  .nav-menu {
    display: none;
  }

  .section {
    padding: 60px 24px;
  }
}
</style>
</head>
<body>

        <g class="asteroids" transform-origin="310 170">

          <circle class="dot-large" cx="530" cy="80" r="12" />
        </g>
